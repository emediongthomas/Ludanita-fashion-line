{% extends "base.html" %}
{% block title %}New order · Ludanita{% endblock %}
{% block content %}
<div class="page-heading">
  <div><div class="eyebrow">CUSTOMER WORK</div><h1>New order</h1><p class="muted">Enter the order details below.</p></div>
  <a class="button button-secondary" href="{{ url_for('orders') }}">← Back to orders</a>
</div>
<form method="post" class="panel form-panel">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-grid">
    <label>Customer name *<input name="customer_name" maxlength="160" required></label>
    <label>Phone<input name="phone" maxlength="60" type="tel"></label>
    <label>Item / style *<input name="item" maxlength="160" required></label>
    <label>Order date *<input name="order_date" type="date" value="{{ today }}" required></label>
    <label>Size<input name="size" maxlength="60"></label>
    <label>Color<input name="color" maxlength="80"></label>
    <label>Quantity *<input name="quantity" type="number" min="1" step="1" required></label>
    <label>Unit price *<input name="unit_price" type="number" min="0" step="0.01" required></label>
    <label>Expected delivery<input name="expected_delivery" type="date"></label>
    <label class="full-width">Notes<textarea name="notes" rows="3"></textarea></label>
  </div>
  <div class="form-actions"><a class="button button-secondary" href="{{ url_for('orders') }}">Cancel</a><button class="button button-primary" type="submit">Save order</button></div>
</form>
{% endblock %}
